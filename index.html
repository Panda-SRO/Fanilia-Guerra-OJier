<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repuesto Gerra Ojier</title>
<meta name="description" content="Repuesto Gerra Ojier — repuestos y servicio automotriz en Chile. Mantención, frenos, motor, diagnóstico y más. Agenda tu cita.">
<meta property="og:type" content="website">
<meta property="og:title" content="Repuesto Gerra Ojier — Repuestos y servicio automotriz">
<meta property="og:description" content="Mantención, frenos, motor, diagnóstico y repuestos. Agenda tu cita con nosotros.">
<meta property="og:site_name" content="Repuesto Gerra Ojier">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style id="app-style">
  :root{
    --bg:#eef1f4;--surface:#ffffff;--surface-2:#f5f7f9;--ink:#161a1f;--muted:#5b6771;
    --deep:#14181d;--deep-2:#20272e;--accent:#e63946;--accent-2:#f4a020;--steel:#2f6f8f;
    --line:rgba(22,26,31,0.12);--line-strong:rgba(22,26,31,0.2);--wa:#25D366;--ok:#1a9d54;
    --shadow:0 10px 30px rgba(20,24,29,0.10);
    --head:'Barlow Condensed',Impact,sans-serif;--sans:'Inter',system-ui,sans-serif;
  }
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
    --bg:#0e1114;--surface:#171c21;--surface-2:#12161a;--ink:#eaf0f4;--muted:#9aa7b1;
    --deep:#0a0d10;--deep-2:#1b2228;--accent:#ff4d5a;--accent-2:#ffb23e;--steel:#4fa3c7;
    --line:rgba(234,240,244,0.14);--line-strong:rgba(234,240,244,0.24);--shadow:0 10px 30px rgba(0,0,0,0.4);
  }}
  :root[data-theme="dark"]{
    --bg:#0e1114;--surface:#171c21;--surface-2:#12161a;--ink:#eaf0f4;--muted:#9aa7b1;
    --deep:#0a0d10;--deep-2:#1b2228;--accent:#ff4d5a;--accent-2:#ffb23e;--steel:#4fa3c7;
    --line:rgba(234,240,244,0.14);--line-strong:rgba(234,240,244,0.24);--shadow:0 10px 30px rgba(0,0,0,0.4);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;color-scheme:light dark;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;}
  img{max-width:100%;}
  [hidden]{display:none !important;}
  h1,h2,h3{font-family:var(--head);font-weight:700;line-height:1.02;margin:0;text-transform:uppercase;letter-spacing:0.01em;}
  p{margin:0;}
  a{color:inherit;}
  ::selection{background:rgba(230,57,70,0.25);}
  :focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:22px;}
  .eyebrow{font-family:var(--sans);font-size:12.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

  header{position:sticky;top:0;z-index:40;background:color-mix(in srgb, var(--deep) 94%, transparent);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.08);}
  .nav{display:flex;align-items:center;justify-content:space-between;gap:18px;padding-block:12px;color:#eef3f6;}
  .brand{display:flex;align-items:center;gap:12px;text-decoration:none;}
  .brand .mark{width:44px;height:44px;flex-shrink:0;}
  .brand .name b{display:block;font-family:var(--head);font-size:21px;font-weight:700;letter-spacing:0.02em;line-height:1;}
  .brand .name span{display:block;font-size:10px;letter-spacing:0.24em;text-transform:uppercase;color:var(--accent-2);margin-top:4px;}
  .nav-links{display:none;gap:24px;font-size:14.5px;color:#c3cdd4;}
  .nav-links a{text-decoration:none;padding-block:6px;border-bottom:2px solid transparent;font-weight:500;}
  .nav-links a:hover{color:#fff;border-color:var(--accent);}
  @media (min-width:900px){.nav-links{display:flex;}}
  .btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:8px;font-family:var(--sans);font-weight:700;font-size:14.5px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s ease, background .15s ease, border-color .15s ease;white-space:nowrap;}
  .btn:hover{transform:translateY(-1px);}
  .btn-wa{background:var(--wa);color:#053;}
  .btn-wa:hover{background:#20c05d;}
  .btn-accent{background:var(--accent);color:#fff;}
  .btn-accent:hover{background:#d12f3c;}
  .btn-ghost{background:transparent;border-color:rgba(255,255,255,0.28);color:#eef3f6;}
  .btn-ghost:hover{border-color:var(--accent);}
  .nav .btn{padding:10px 16px;}
  .nav-right{display:flex;align-items:center;gap:12px;}
  .admin-btn{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:8px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.18);color:#c3cdd4;cursor:pointer;transition:.15s;flex-shrink:0;}
  .admin-btn:hover{color:#fff;border-color:var(--accent);background:rgba(255,255,255,0.14);}
  .admin-btn.on{color:#7CFC98;border-color:var(--wa);background:rgba(37,211,102,0.15);}

  .hero{position:relative;background:linear-gradient(155deg,var(--deep) 0%, var(--deep-2) 100%);color:#eef3f6;overflow:hidden;}
  .hero::after{content:"";position:absolute;right:-140px;top:-80px;width:520px;height:520px;background:radial-gradient(circle, rgba(230,57,70,0.22), transparent 62%);pointer-events:none;}
  .hero-stripe{position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(45deg,var(--accent) 0 22px,#14181d 22px 44px);opacity:.9;}
  .hero-inner{position:relative;z-index:2;display:grid;grid-template-columns:1.15fr 0.85fr;gap:40px;align-items:center;padding-block:72px 92px;}
  .hero-eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--accent-2);font-weight:700;font-size:12.5px;letter-spacing:0.16em;text-transform:uppercase;}
  .hero-eyebrow::before{content:"";width:26px;height:2px;background:var(--accent-2);}
  .hero h1{font-size:clamp(42px,6vw,78px);margin-top:18px;max-width:15ch;}
  .hero h1 em{font-style:normal;color:var(--accent);}
  .hero .lead{margin-top:20px;font-size:clamp(16px,1.6vw,19px);color:#c3cdd4;max-width:48ch;}
  .hero-ctas{display:flex;gap:13px;flex-wrap:wrap;margin-top:30px;}
  .hero-badges{display:flex;gap:22px;flex-wrap:wrap;margin-top:38px;}
  .hero-badges div{display:flex;align-items:center;gap:9px;font-size:13.5px;color:#c3cdd4;}
  .hero-badges svg{color:var(--accent-2);flex-shrink:0;}
  .hero-art{position:relative;display:flex;justify-content:center;align-items:center;}
  .hero-art svg{width:100%;max-width:400px;filter:drop-shadow(0 18px 30px rgba(0,0,0,0.4));}
  @media (max-width:860px){.hero-inner{grid-template-columns:1fr;padding-block:52px 72px;gap:26px;}.hero-art{order:-1;}.hero-art svg{max-width:260px;}}

  .trust{background:var(--surface);border-bottom:1px solid var(--line);}
  .trust-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-block:26px;}
  .trust .t{display:flex;gap:12px;align-items:center;}
  .trust .t svg{color:var(--accent);flex-shrink:0;}
  .trust .t b{display:block;font-size:15px;font-family:var(--head);letter-spacing:0.02em;}
  .trust .t span{font-size:13px;color:var(--muted);}
  @media (max-width:720px){.trust-grid{grid-template-columns:1fr 1fr;gap:22px 16px;}}

  section{padding-block:76px;}
  .sec-head{max-width:62ch;margin-bottom:32px;}
  .sec-head h2{font-size:clamp(30px,4vw,46px);margin-top:8px;}
  .sec-head p{margin-top:12px;color:var(--muted);font-size:16.5px;}

  .services{background:var(--surface-2);}
  .filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px;}
  .filter{border:1px solid var(--line-strong);background:transparent;color:var(--ink);font-family:var(--sans);font-weight:600;font-size:14px;padding:9px 17px;border-radius:8px;cursor:pointer;transition:.15s;}
  .filter:hover{border-color:var(--accent);}
  .filter.active{background:var(--deep);color:#eef3f6;border-color:var(--deep);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .filter.active{background:var(--accent);border-color:var(--accent);color:#fff;}}
  :root[data-theme="dark"] .filter.active{background:var(--accent);border-color:var(--accent);color:#fff;}

  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:900px){.grid{grid-template-columns:1fr 1fr;}}
  @media (max-width:560px){.grid{grid-template-columns:1fr;}}
  .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:transform .18s ease, box-shadow .18s ease;}
  .card:hover{transform:translateY(-4px);box-shadow:0 16px 36px rgba(20,24,29,0.16);}
  .card-media{position:relative;height:150px;background:linear-gradient(150deg, color-mix(in srgb,var(--steel) 20%, var(--surface)), color-mix(in srgb,var(--accent) 14%, var(--surface)));display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--deep);}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .card-media{color:#eef3f6;}}
  :root[data-theme="dark"] .card-media{color:#eef3f6;}
  .card-media img{width:100%;height:100%;object-fit:cover;display:block;}
  .card-media .ico{width:64px;height:64px;opacity:.85;}
  .card-body{padding:18px 20px;display:flex;flex-direction:column;flex-grow:1;}
  .card-body h3{font-size:22px;}
  .card .cat{font-size:12px;color:var(--steel);font-weight:700;margin-top:4px;text-transform:uppercase;letter-spacing:0.04em;}
  .card .desc{font-size:14px;color:var(--muted);margin-top:9px;flex-grow:1;}
  .card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:16px;}
  .price{font-family:var(--head);font-weight:700;font-size:26px;color:var(--ink);line-height:1;font-variant-numeric:tabular-nums;}
  .price small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted);font-weight:500;margin-top:5px;text-transform:none;letter-spacing:0;}
  .btn-order{background:var(--accent);color:#fff;border:none;font-family:var(--sans);font-weight:700;font-size:13.5px;padding:11px 15px;border-radius:8px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:transform .15s ease, background .15s ease;text-decoration:none;}
  .btn-order:hover{transform:translateY(-1px);background:#d12f3c;}
  .services-note{margin-top:24px;font-size:13.5px;color:var(--muted);display:flex;gap:9px;align-items:flex-start;}
  .services-note svg{color:var(--accent);flex-shrink:0;margin-top:2px;}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:15px;grid-column:1/-1;}

  .book-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px;box-shadow:var(--shadow);max-width:780px;}
  .book-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .book-form .full{grid-column:1/-1;}
  @media (max-width:560px){.book-form{grid-template-columns:1fr;}}
  .book-form .a-input,.book-form .a-select,.book-form .a-text{width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:15px;}
  .book-form .a-text{resize:vertical;min-height:60px;}
  .book-form .a-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;}
  .book-actions{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .book-msg{font-size:14px;font-weight:600;}
  .book-msg.ok{color:var(--ok);}
  .book-msg.err{color:#d9503b;}
  .badge.web{background:rgba(47,111,143,0.16);color:var(--steel);}

  .gallery-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media (max-width:900px){.gallery-grid{grid-template-columns:1fr 1fr;}}
  .gal{position:relative;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--surface-2);border:1px solid var(--line);}
  .gal img{width:100%;height:100%;object-fit:cover;display:block;}
  .gal .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(10,13,16,0.82));color:#fff;font-size:12.5px;padding:22px 12px 10px;font-weight:600;}
  .gal-ph{display:flex;align-items:center;justify-content:center;height:100%;color:var(--muted);font-size:12.5px;text-align:center;padding:10px;}

  .steps{background:var(--deep);color:#eef3f6;}
  .steps .sec-head h2{color:#fff;}
  .steps .sec-head p{color:#c3cdd4;}
  .steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;}
  @media (max-width:820px){.steps-grid{grid-template-columns:1fr;}}
  .step{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:26px;}
  .step .n{font-family:var(--head);font-size:32px;color:var(--accent);font-weight:700;}
  .step h3{color:#fff;font-size:21px;margin:10px 0 8px;}
  .step p{font-size:14.5px;color:#c3cdd4;}

  .contact-grid{display:grid;grid-template-columns:1.05fr 0.95fr;gap:24px;}
  @media (max-width:820px){.contact-grid{grid-template-columns:1fr;}}
  .info-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px;}
  .info-row{display:flex;gap:14px;padding-block:15px;border-bottom:1px solid var(--line);}
  .info-row:last-child{border-bottom:none;}
  .info-row svg{color:var(--accent);flex-shrink:0;margin-top:2px;}
  .info-row b{display:block;font-size:15px;margin-bottom:3px;}
  .info-row span{font-size:14px;color:var(--muted);}
  .hours .h{display:flex;justify-content:space-between;font-size:14px;padding-block:8px;border-bottom:1px solid var(--line);}
  .hours .h:last-child{border-bottom:none;}
  .hours .h .d{color:var(--muted);}
  .hours .h .t{font-weight:600;font-variant-numeric:tabular-nums;}
  .cta-card{background:linear-gradient(160deg,var(--deep),var(--deep-2));color:#eef3f6;border-radius:14px;padding:30px;display:flex;flex-direction:column;justify-content:center;}
  .cta-card h3{color:#fff;font-size:27px;margin-bottom:10px;}
  .cta-card p{color:#c3cdd4;font-size:15px;margin-bottom:20px;}
  .pill-note{font-size:12.5px;color:var(--accent-2);margin-top:14px;}

  footer{background:var(--deep);color:#a9b6bf;padding-block:42px 24px;border-top:4px solid var(--accent);}
  .foot-grid{display:flex;flex-wrap:wrap;gap:24px;justify-content:space-between;align-items:flex-start;}
  .foot-brand{display:flex;align-items:center;gap:12px;}
  .foot-brand .name b{color:#fff;font-family:var(--head);font-size:20px;}
  .foot-links a{text-decoration:none;display:block;font-size:14px;line-height:2;}
  .foot-links a:hover{color:#fff;}
  .foot-bottom{margin-top:28px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.1);font-size:12.5px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;}

  .wa-float{position:fixed;right:20px;bottom:20px;z-index:60;width:60px;height:60px;border-radius:50%;background:var(--wa);display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;box-shadow:0 8px 22px rgba(0,0,0,0.3);animation:pulse 2.6s ease-out infinite;transition:transform .18s ease;}
  .wa-float:hover{transform:scale(1.07);}
  .wa-float svg{width:33px;height:33px;}
  .wa-float .lbl{position:absolute;right:72px;background:var(--deep);color:#eef3f6;font-size:13.5px;font-weight:600;padding:8px 13px;border-radius:8px;white-space:nowrap;box-shadow:var(--shadow);opacity:0;pointer-events:none;transform:translateX(6px);transition:.2s;}
  .wa-float:hover .lbl,.wa-float:focus-visible .lbl{opacity:1;transform:translateX(0);}
  @keyframes pulse{0%{box-shadow:0 8px 22px rgba(0,0,0,0.3),0 0 0 0 rgba(37,211,102,0.5);}70%{box-shadow:0 8px 22px rgba(0,0,0,0.3),0 0 0 16px rgba(37,211,102,0);}100%{box-shadow:0 8px 22px rgba(0,0,0,0.3),0 0 0 0 rgba(37,211,102,0);}}
  @media (max-width:560px){.wa-float{width:54px;height:54px;right:16px;bottom:16px;}.wa-float .lbl{display:none;}}

  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--deep);color:#eef3f6;padding:14px 22px;border-radius:10px;font-weight:600;font-size:14.5px;box-shadow:0 10px 30px rgba(0,0,0,0.4);z-index:200;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px);text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ===== ADMIN ===== */
  .admin-overlay{position:fixed;inset:0;background:rgba(6,9,12,0.66);backdrop-filter:blur(3px);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:22px 12px;overflow:auto;}
  .admin-panel{background:var(--surface);color:var(--ink);width:100%;max-width:940px;border-radius:14px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,0.5);border:1px solid var(--line);}
  .admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:12px;}
  .admin-head h3{font-size:24px;}
  .admin-close{background:none;border:none;font-size:28px;line-height:1;color:var(--muted);cursor:pointer;}
  .admin-sub{color:var(--muted);font-size:14px;margin-bottom:18px;}
  .a-input,.a-select,.a-text{width:100%;padding:10px 12px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);color:var(--ink);font-family:var(--sans);font-size:15px;}
  .a-text{resize:vertical;min-height:52px;font-size:14px;}
  .a-label{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:4px;display:block;}
  .login-box{display:flex;flex-direction:column;gap:14px;max-width:360px;}
  .btn-primary{background:var(--accent);color:#fff;border:none;padding:12px 20px;border-radius:8px;font-weight:700;font-size:14.5px;cursor:pointer;font-family:var(--sans);}
  .btn-primary:disabled{opacity:.6;cursor:default;}
  .btn-dark{background:var(--deep);color:#fff;border:none;padding:11px 17px;border-radius:8px;font-weight:600;cursor:pointer;font-family:var(--sans);font-size:14px;}
  .btn-ghost2{background:none;border:1px solid var(--line-strong);color:var(--ink);padding:11px 17px;border-radius:8px;font-weight:600;cursor:pointer;font-family:var(--sans);font-size:14px;}
  .btn-del{background:none;border:1px solid var(--line-strong);color:#d9503b;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--sans);}
  .btn-mini{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink);padding:7px 11px;border-radius:7px;cursor:pointer;font-size:12.5px;font-family:var(--sans);font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none;}
  .btn-mini:hover{border-color:var(--accent);}
  .err{color:#d9503b;font-size:13.5px;margin-top:4px;}
  .ok{color:var(--ok);font-size:13.5px;}
  .admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .admin-user{font-size:13px;color:var(--muted);}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:18px;}
  .tab{background:none;border:none;border-bottom:3px solid transparent;color:var(--muted);font-family:var(--sans);font-weight:700;font-size:14px;padding:10px 14px;cursor:pointer;margin-bottom:-1px;}
  .tab.active{color:var(--ink);border-color:var(--accent);}
  .admin-actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;position:sticky;bottom:0;background:var(--surface);padding-top:14px;border-top:1px solid var(--line);}
  .save-status{font-size:13.5px;color:var(--muted);}

  .admin-row{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:90px 1fr;gap:14px;}
  @media (max-width:560px){.admin-row{grid-template-columns:1fr;}}
  .admin-thumb{width:90px;height:90px;border-radius:10px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;position:relative;}
  .admin-thumb img{width:100%;height:100%;object-fit:cover;}
  .admin-thumb .ph{color:var(--muted);font-size:11px;text-align:center;padding:6px;}

}

/* ============ TOAST ============ */
let toastT; function toast(msg){ const t=document.getElementById('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3800); }
function waGo(msg){ if(!WA_ENABLED){ toast(WA_SOON_MSG); return; } window.open(waUrl(WA_NUMBER,msg||('Hola '+bizConfig.nombre)), '_blank','noopener'); }

/* ============ EVENTOS ============ */
document.addEventListener('click', e=>{
  const bs=e.target.closest && e.target.closest('[data-book-serv]');
  if(bs){ const sel=document.getElementById('bk-serv'); if(sel){ const v=bs.getAttribute('data-book-serv'); Array.from(sel.options).forEach(o=>{ if(o.value===v||o.textContent===v) sel.value=o.value; }); } /* el href="#agenda" hace el scroll */ }
  const waEl=e.target.closest && e.target.closest('[data-wa]');
  if(waEl){ e.preventDefault(); waGo(waEl.getAttribute('data-wa-msg')); return; }
  const f=e.target.closest && e.target.closest('.filter');
  if(f){ activeCat=f.getAttribute('data-cat'); document.querySelectorAll('.filter').forEach(b=>b.classList.toggle('active',b===f)); const grid=document.getElementById('grid'); if(grid) grid.innerHTML=gridHTML(activeCat==='Todos'?services:services.filter(p=>p.c===activeCat)); return; }
  if(e.target.closest && e.target.closest('#open-admin')){ e.preventDefault(); openAdmin(); return; }
  if(e.target.id==='admin-overlay' || e.target.id==='admin-close'){ closeAdmin(); return; }
  if(e.target.id==='btn-login'){ doLogin(); return; }
  if(e.target.id==='btn-forget'){ try{ localStorage.removeItem('gerra_admin_email'); }catch(err){} renderPanel(); return; }
  if(e.target.id==='btn-logout'){ doLogout(); return; }
  const tb=e.target.closest && e.target.closest('.tab'); if(tb){ adminTab=tb.getAttribute('data-tab'); renderPanel(); return; }
  if(handleAdminClick(e)) return;
});

document.addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.target.id==='login-pass'||e.target.id==='login-email')){ e.preventDefault(); doLogin(); } });

function openAdmin(){ const ov=document.getElementById('admin-overlay'); if(!ov) return; ov.hidden=false; renderPanel(); }

function status(m){ const s=document.getElementById('save-status'); if(s) s.textContent=m; }
function renderPanel(){
  const el=document.getElementById('admin-panel'); if(!el) return;

  if(!fb){ const msg=fbState==='loading'?'Conectando con la base de datos… espera unos segundos.':'No se pudo conectar con la base de datos. Revisa tu internet e intenta de nuevo.'; el.innerHTML=headHTML('Administración')+'<p class="admin-sub">'+msg+'</p>'; return; }
  if(!currentUser){ renderLogin(el); return; }
  el.innerHTML=headHTML('Panel de administración')
    +'<div class="admin-toolbar"><span class="admin-user">Conectado como <b>'+esc(currentUser.email||'admin')+'</b></span><button class="btn-ghost2" id="btn-logout">Cerrar sesión</button></div>'

function headHTML(t){ return '<div class="admin-head"><h3>'+esc(t)+'</h3><button class="admin-close" id="admin-close">×</button></div>'; }
function tabsHTML(){ const tabs=[['servicios','Servicios'],['galeria','Galería'],['citas','Citas'],['facturas','Facturas'],['ajustes','Ajustes']]; return '<div class="tabs">'+tabs.map(t=>'<button class="tab'+(adminTab===t[0]?' active':'')+'" data-tab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'; }
function renderTabBody(){ if(adminTab==='servicios') renderServicios(); else if(adminTab==='galeria') renderGaleria(); else if(adminTab==='citas') renderCitas(); else if(adminTab==='facturas') renderFacturas(); else if(adminTab==='ajustes') renderAjustes(); }

function renderLogin(el){
  let savedEmail=''; try{ savedEmail=localStorage.getItem('gerra_admin_email')||''; }catch(e){}
  el.innerHTML=headHTML('Iniciar sesión')
  +'<p class="admin-sub">Ingresa con tu correo y contraseña de administrador.</p>'
  +'<div class="login-box">'
  +'<div><label class="a-label" for="login-email">Correo</label><input class="a-input" id="login-email" type="email" autocomplete="username" inputmode="email" value="'+esc(savedEmail)+'"></div>'
  +'<div><label class="a-label" for="login-pass">Contraseña</label><input class="a-input" id="login-pass" type="password" autocomplete="current-password"></div>'
  +'<button class="btn-primary" id="btn-login">Entrar</button>'
  +(savedEmail?'<div class="save-status">👤 Correo guardado: <b>'+esc(savedEmail)+'</b> <button type="button" id="btn-forget" style="background:none;border:none;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline;padding:0;margin-left:6px;">olvidar</button></div>':'<div class="save-status">Se recordará tu correo en este dispositivo.</div>')
  +'<div class="err" id="login-err" hidden></div></div>';
  const em=document.getElementById('login-email'),pa=document.getElementById('login-pass'); if(savedEmail&&pa) pa.focus(); else if(em) em.focus();

function authErr(code){ const m={'auth/invalid-email':'El correo no es válido.','auth/user-not-found':'No existe ese usuario.','auth/wrong-password':'Contraseña incorrecta.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/too-many-requests':'Demasiados intentos. Espera un momento.','auth/network-request-failed':'Sin conexión. Revisa tu internet.'}; return m[code]||'No se pudo iniciar sesión.'; }
async function doLogin(){
  const em=document.getElementById('login-email'),pa=document.getElementById('login-pass'),er=document.getElementById('login-err'),bt=document.getElementById('btn-login');
  if(!em||!pa) return; er.hidden=true; bt.disabled=true; bt.textContent='Entrando…';
  const email=em.value.trim();
  try{ await fb.signInWithEmailAndPassword(fb.auth,email,pa.value); try{ localStorage.setItem('gerra_admin_email',email); }catch(e){} }
  catch(ex){ er.textContent=authErr(ex&&ex.code); er.hidden=false; bt.disabled=false; bt.textContent='Entrar'; }
}
async function doLogout(){ try{ await fb.signOut(fb.auth); }catch(ex){} closeAdmin(); }

/* imagen -> dataURL comprimido */
function resizeImage(file,maxDim,q){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ let w=img.width,h=img.height; if(w>h&&w>maxDim){h=Math.round(h*maxDim/w);w=maxDim;} else if(h>maxDim){w=Math.round(w*maxDim/h);h=maxDim;} const c=document.createElement('canvas'); c.width=w;c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); try{res(c.toDataURL('image/jpeg',q));}catch(err){rej(err);} }; img.onerror=rej; img.src=r.result; }; r.onerror=rej; r.readAsDataURL(file); }); }

function svcRestore(){ const have={}; adminServices.forEach(s=>have[String(s.n||'').trim().toLowerCase()]=1); let added=0; DEFAULT_SERVICES.forEach(d=>{ if(!have[d.n.trim().toLowerCase()]){ adminServices.push({id:'',n:d.n,c:d.c,p:d.p,d:d.d,_new:true}); added++; } }); drawSvcRows(); status(added?('Se agregaron '+added+' servicio(s). Revisa y guarda.'):'Ya tienes todos los servicios base.'); }
async function svcSave(){
  for(let i=0;i<adminServices.length;i++){ const s=adminServices[i]; if(!String(s.n||'').trim()){ status('Falta el nombre en un servicio (fila '+(i+1)+').'); return; } if(!(s.p>=0)){ status('Precio inválido en “'+(s.n||('fila '+(i+1)))+'”.'); return; } }
  const bt=document.getElementById('svc-save'); if(bt) bt.disabled=true; status('Guardando…');
  try{
    const batch=fb.writeBatch(fb.db); let changes=0;
    adminServices.forEach((s,i)=>{ const id=s.id||newId(s.n); const data={n:String(s.n).trim(),c:s.c||'Mantención',p:parseInt(s.p,10)||0,d:String(s.d||'').trim(),o:i}; if(s.img) data.img=s.img; const k=svcKey({n:data.n,c:data.c,p:data.p,d:data.d,img:s.img||'',o:i}); if(!s.id||svcKeys[id]!==k){ batch.set(fb.doc(fb.db,'taller_servicios',id),data); changes++; } s.id=id; });
    (deletedSvc||[]).forEach(id=>{ batch.delete(fb.doc(fb.db,'taller_servicios',id)); changes++; });
    if(changes===0){ status('No hay cambios que guardar.'); if(bt) bt.disabled=false; return; }
    await Promise.race([batch.commit(), new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('timeout'),{code:'timeout'})),20000))]);
    deletedSvc=[]; services=adminServices.map((s,i)=>({id:s.id,o:i,n:String(s.n).trim(),c:s.c,p:parseInt(s.p,10)||0,d:String(s.d||'').trim(),img:s.img||undefined})); fromDB=true; svcKeys={}; services.forEach(s=>svcKeys[s.id]=svcKey(s)); repaintPublic(); status('¡Guardado! Publicado. ✓');
  }catch(ex){ status(saveErr(ex)); } finally{ const b=document.getElementById('svc-save'); if(b) b.disabled=false; }
}
function saveErr(ex){ const c=ex&&ex.code; if(c==='permission-denied') return '⚠️ Permiso denegado: falta PUBLICAR las reglas de Firestore.'; if(c==='timeout') return '⚠️ Tardó demasiado. Revisa tu internet y las reglas, e intenta otra vez.'; if(c==='unavailable') return 'Sin conexión con la base de datos.'; return 'No se pudo guardar'+(c?' ('+c+')':'')+'.'; }

    +'<div class="inv-grid"><div class="box"><b>Cliente</b>'+esc(f.cliente||'—')+(f.rut?('<br>RUT: '+esc(f.rut)):'')+(f.telefono?('<br>Tel: '+esc(f.telefono)):'')+'</div><div class="box"><b>Vehículo</b>'+esc(f.vehiculo||'—')+(f.patente?('<br>Patente: '+esc(f.patente)):'')+'</div></div>'
    +'<table class="it"><thead><tr><th>Detalle</th><th class="r">Cant.</th><th class="r">P. unit.</th><th class="r">Subtotal</th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<div class="inv-tot"><div class="r"><span>Neto</span><span>'+CLP(f.neto)+'</span></div><div class="r"><span>IVA 19%</span><span>'+CLP(f.iva)+'</span></div><div class="r grand"><span>TOTAL</span><span>'+CLP(f.total)+'</span></div></div>'
    +(f.notas?'<div style="margin-top:16px;font-size:13px;color:#444;"><b>Notas:</b> '+esc(f.notas)+'</div>':'')
    +'<div class="inv-foot">Gracias por preferir '+esc(cfg.nombre)+'. Documento no tributario / comprobante interno.</div></div>';
}
function printInvoice(f){ const pa=document.getElementById('print-area'); if(!pa) return; pa.innerHTML=invoiceHTML(f); window.print(); }

/* ============ DELEGACIÓN ADMIN ============ */
function handleAdminClick(e){
  const t=e.target;
  // servicios
  if(t.id==='svc-add'){ svcAdd(); return true; }
  if(t.id==='svc-restore'){ svcRestore(); return true; }
  if(t.id==='svc-save'){ svcSave(); return true; }
  let d=t.closest && t.closest('[data-svc-del]'); if(d){ const i=+d.getAttribute('data-svc-del'); const it=adminServices[i]; if(it&&it.id&&fromDB) deletedSvc.push(it.id); adminServices.splice(i,1); drawSvcRows(); return true; }
  let pk=t.closest && t.closest('.admin-thumb-btn'); if(pk){ const fi=pk.parentNode.querySelector('input[type=file]'); if(fi) fi.click(); return true; }
  // galeria
  if(t.id==='gal-add'){ galAdd(); return true; }
  if(t.id==='gal-save'){ galSave(); return true; }
  let gd=t.closest && t.closest('[data-gal-del]'); if(gd){ const i=+gd.getAttribute('data-gal-del'); const it=adminGallery[i]; if(it&&it.id&&fromDB) deletedGal.push(it.id); adminGallery.splice(i,1); drawGalRows(); return true; }
  // ajustes
  if(t.id==='cfg-save'){ cfgSave(); return true; }
  // citas
  if(t.id==='cal-prev'){ calM--; if(calM<0){calM=11;calY--;} drawCalendar(); return true; }
  if(t.id==='cal-next'){ calM++; if(calM>11){calM=0;calY++;} drawCalendar(); return true; }
  if(t.id==='cal-today'){ const n=new Date(); calY=n.getFullYear(); calM=n.getMonth(); selDay=todayISO(); drawCalendar(); drawCitaList(); return true; }
  let cell=t.closest && t.closest('.cal-cell[data-day]'); if(cell){ selDay=cell.getAttribute('data-day'); drawCalendar(); drawCitaList(); return true; }
  if(t.id==='cita-new'){ citaEdit={fecha:selDay,hora:'09:00',estado:'pendiente'}; renderTabBody(); return true; }
  if(t.id==='cita-save'){ citaSave(); return true; }
  if(t.id==='cita-cancel'){ citaEdit=null; renderTabBody(); return true; }
  let ce=t.closest && t.closest('[data-cita-edit]'); if(ce){ const c=citas.find(x=>x.id===ce.getAttribute('data-cita-edit')); if(c){ citaEdit=Object.assign({},c); renderTabBody(); } return true; }
  let cd=t.closest && t.closest('[data-cita-del]'); if(cd){ citaDelete(cd.getAttribute('data-cita-del')); return true; }
  let cdn=t.closest && t.closest('[data-cita-done]'); if(cdn){ citaMarkDone(cdn.getAttribute('data-cita-done')); return true; }
  let cics=t.closest && t.closest('[data-cita-ics]'); if(cics){ const c=citas.find(x=>x.id===cics.getAttribute('data-cita-ics')); if(c) downloadICS(c); return true; }
  // facturas
  if(t.id==='fac-additem'){ facDraft.items.push({d:'',qty:1,price:0}); drawFacItems(); return true; }
  if(t.id==='fac-clear'){ facDraft=newDraft(); renderFacturas(); return true; }
  if(t.id==='fac-save'){ facSave(); return true; }
  if(t.id==='fac-print'||t.id==='fac-pdf'){ const items=(facDraft.items||[]).filter(it=>String(it.d||'').trim()); if(!items.length){ status('Agrega al menos una línea para imprimir.'); return true; } const tt=facTotals({items}); printInvoice({folio:'—',fecha:facDraft.fecha,cliente:facDraft.cliente,rut:facDraft.rut,telefono:facDraft.telefono,vehiculo:facDraft.vehiculo,patente:facDraft.patente,notas:facDraft.notas,items:items.map(it=>({d:it.d,qty:parseInt(it.qty,10)||0,price:parseInt(it.price,10)||0})),neto:tt.neto,iva:tt.iva,total:tt.total}); if(t.id==='fac-pdf') toast('En el diálogo de impresión, elige “Guardar como PDF”.'); return true; }
  let fdi=t.closest && t.closest('[data-fac-delitem]'); if(fdi){ const i=+fdi.getAttribute('data-fac-delitem'); facDraft.items.splice(i,1); if(!facDraft.items.length) facDraft.items.push({d:'',qty:1,price:0}); drawFacItems(); refreshFacTotals(); return true; }
  let fo=t.closest && t.closest('[data-fac-open]'); if(fo){ const f=facturas.find(x=>x.id===fo.getAttribute('data-fac-open')); if(f) printInvoice(f); return true; }
  let fd=t.closest && t.closest('[data-fac-del]'); if(fd){ facDelete(fd.getAttribute('data-fac-del')); return true; }
  return false;
}
function handleAdminInput(e){
  const el=e.target; if(!el.getAttribute) return;
  let f;
  if((f=el.getAttribute('data-sf'))!=null && adminServices){ const i=+el.getAttribute('data-si'); if(adminServices[i]){ if(f==='p') adminServices[i].p=Math.max(0,parseInt(el.value||'0',10)||0); else adminServices[i][f]=el.value; if(f==='n'){ const st=el.closest('.admin-row').querySelector('.r-top strong'); if(st) st.textContent=el.value||'Nuevo servicio'; } } return; }
  if((f=el.getAttribute('data-gf'))!=null && adminGallery){ const i=+el.getAttribute('data-gi'); if(adminGallery[i]) adminGallery[i][f]=el.value; return; }
  if((f=el.getAttribute('data-cf'))!=null && adminConfig){ adminConfig[f]=el.value; return; }
  if((f=el.getAttribute('data-ci'))!=null && citaEdit){ citaEdit[f]=el.value; return; }
  if((f=el.getAttribute('data-ff'))!=null && facDraft){ facDraft[f]=el.value; return; }
  if((f=el.getAttribute('data-if'))!=null && facDraft){ const i=+el.getAttribute('data-ii'); if(facDraft.items[i]){ if(f==='d') facDraft.items[i].d=el.value; else facDraft.items[i][f]=Math.max(0,parseInt(el.value||'0',10)||0); refreshFacTotals(); } return; }
}
function handleAdminChange(e){
  const el=e.target; if(el.type!=='file') return;
  let i;
  if((i=el.getAttribute('data-svc-img'))!=null){ const idx=+i; const file=el.files&&el.files[0]; if(!file||!adminServices[idx]) return; resizeImage(file,800,0.6).then(u=>{ adminServices[idx].img=u; drawSvcRows(); }).catch(()=>toast('No se pudo procesar la imagen.')); return; }
  if((i=el.getAttribute('data-gal-img'))!=null){ const idx=+i; const file=el.files&&el.files[0]; if(!file||!adminGallery[idx]) return; resizeImage(file,1000,0.62).then(u=>{ adminGallery[idx].img=u; drawGalRows(); }).catch(()=>toast('No se pudo procesar la imagen.')); return; }
}

/* ============ FIREBASE ============ */
(async function initFirebase(){
  if(!FB_READY){ fbState='demo'; return; }
  try{
    const V='https://www.gstatic.com/firebasejs/10.12.2/';
    const [appMod,fsMod,authMod]=await Promise.all([import(V+'firebase-app.js'),import(V+'firebase-firestore.js'),import(V+'firebase-auth.js')]);
    const application=appMod.initializeApp(firebaseConfig); const db=fsMod.getFirestore(application); const auth=authMod.getAuth(application);
    fb={db,auth,collection:fsMod.collection,getDocs:fsMod.getDocs,doc:fsMod.doc,setDoc:fsMod.setDoc,deleteDoc:fsMod.deleteDoc,writeBatch:fsMod.writeBatch,signInWithEmailAndPassword:authMod.signInWithEmailAndPassword,signOut:authMod.signOut,onAuthStateChanged:authMod.onAuthStateChanged};
    fbState='ready';
    { const ov=document.getElementById('admin-overlay'); if(ov&&!ov.hidden) renderPanel(); }
    // cargar datos públicos
    try{ const snap=await fb.getDocs(fb.collection(db,'taller_servicios')); if(!snap.empty){ services=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.o||0)-(b.o||0)); fromDB=true; } }catch(ex){ console.warn('servicios',ex); }
    try{ const snap=await fb.getDocs(fb.collection(db,'taller_galeria')); if(!snap.empty){ gallery=snap.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>(a.o||0)-(b.o||0)); fromDB=true; } }catch(ex){ console.warn('galeria',ex); }
    try{ const cs=await fb.getDocs(fb.collection(db,'taller_config')); cs.forEach(d=>{ if(d.id==='negocio') bizConfig=Object.assign({},DEFAULT_CONFIG,d.data()); }); }catch(ex){ console.warn('config',ex); }
    { const ov=document.getElementById('admin-overlay'); const open=ov&&!ov.hidden; paint(); if(open){ const o2=document.getElementById('admin-overlay'); if(o2) o2.hidden=false; renderPanel(); } else repaintPublic(); }
    // sesión admin
    fb.onAuthStateChanged(auth,async u=>{
      currentUser=u; const b=document.getElementById('open-admin'); if(b) b.classList.toggle('on',!!u);
      adminServices=null; adminGallery=null; adminConfig=null;
      if(u){ try{ const cs=await fb.getDocs(fb.collection(db,'taller_citas')); citas=cs.docs.map(d=>Object.assign({id:d.id},d.data())); }catch(ex){ citas=[]; console.warn('citas',ex); } try{ const fs=await fb.getDocs(fb.collection(db,'taller_facturas')); facturas=fs.docs.map(d=>Object.assign({id:d.id},d.data())); }catch(ex){ facturas=[]; console.warn('facturas',ex); } }
      else { citas=[]; facturas=[]; }
      const ov=document.getElementById('admin-overlay'); if(ov&&!ov.hidden) renderPanel();
    });
  }catch(ex){ console.warn('Firebase no disponible',ex); fb=null; fbState='failed'; const ov=document.getElementById('admin-overlay'); if(ov&&!ov.hidden) renderPanel(); }
})();
</script>
